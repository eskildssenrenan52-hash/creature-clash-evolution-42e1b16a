plugins {
    id 'com.android.application'
}

android {
    namespace 'com.twelvecreatureclash.game'
    compileSdk 35

    defaultConfig {
        applicationId "com.twelvecreatureclash.game"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assinatura: configure um keystore antes de publicar (veja ANDROID.md).
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Evita classes duplicadas entre kotlin-stdlib e os artefatos legados jdk7/jdk8.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
